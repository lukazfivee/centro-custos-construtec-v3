name = "centro-custos-api"
main = "src/index.js"
compatibility_date = "2026-09-14"
workers_dev = true

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/v1/*", "/health" ]

[[d1_databases]]
binding = "DB"
database_name = "centro-custos-producao"
database_id = "95e0be7b-2f59-4af4-87c3-95dc6b0ef95c"
