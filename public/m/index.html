<!doctype html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f8fa">
  <meta name="color-scheme" content="light dark">
  <title>Centro de Custos</title>
  <link rel="icon" href="simbolo.png">
  <link rel="stylesheet" href="m.css">
  <link rel="stylesheet" href="anim.css">
</head>
<body>
  <div id="netbar" class="netbar" role="status" hidden></div>
  <div id="view"></div>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute">
    <filter id="cc-glass-distortion" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="soft-noise" />
      <feDisplacementMap in="SourceGraphic" in2="soft-noise" scale="48" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <nav id="tabs" class="tabs" aria-label="Navegação principal"></nav>
  <script src="icons.js"></script>
  <script src="core.js"></script>
  <script src="queue.js"></script>
  <script src="app.js"></script>
  <script src="screen-home.js"></script>
  <script src="screen-obra.js"></script>
  <script src="screen-lancar.js"></script>
  <script src="screen-misc.js"></script>
  <script src="suite.js"></script>
  <script src="screen-avisos.js"></script>
</body>
</html>
