<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Centro de Custos | Construtec</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{display:grid;place-items:center;height:100vh;background:linear-gradient(135deg,#021D26,#0c2737);font-family:system-ui,-apple-system,sans-serif;color:#fff;overflow:hidden}
    .center{text-align:center;max-width:400px}
    .logo{width:48px;height:48px;background:#f7941d;border-radius:12px;margin:0 auto 24px;display:grid;place-items:center;font-size:20px;font-weight:800;color:#021D26}
    h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
    p{font-size:13px;color:#8fa3a8;margin-bottom:24px}
    .bar{width:200px;height:3px;background:rgba(255,255,255,.1);border-radius:3px;margin:0 auto;overflow:hidden}
    .bar::after{content:"";display:block;width:40%;height:100%;background:#f7941d;border-radius:3px;animation:slide 1.2s ease-in-out infinite}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  </style>
</head>
<body>
  <div class="center">
    <div class="logo">C</div>
    <h1>Centro de Custos</h1>
    <p>Construtec Engenharia</p>
    <div class="bar"></div>
  </div>
  <script>
    const check = setInterval(async () => {
      try {
        const r = await fetch('http://127.0.0.1:3333/api/health');
        if (r.ok) {
          clearInterval(check);
          window.location.href = 'http://127.0.0.1:3333';
        }
      } catch {}
    }, 500);
  </script>
</body>
</html>
