<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Centro de Custos | Construtec</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{display:grid;place-items:center;height:100vh;background:linear-gradient(135deg,#021D26,#0c2737);font-family:system-ui,-apple-system,sans-serif;color:#fff;overflow:hidden}
    .center{text-align:center;max-width:400px}
    .logo{width:56px;height:56px;object-fit:contain;margin:0 auto 24px;display:block}
    h1{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
    p{font-size:14px;color:#b8c7cb;margin-bottom:24px}
    .bar{width:200px;height:3px;background:rgba(255,255,255,.1);border-radius:3px;margin:0 auto;overflow:hidden}
    .bar::after{content:"";display:block;width:100%;height:100%;background:#32a9cd;border-radius:3px;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  </style>
</head>
<body>
  <div class="center">
    <img class="logo" src="assets/construtec-favicon.png" alt="Construtec">
    <h1>Centro de Custos</h1>
    <p>Construtec Engenharia</p>
    <div class="bar"></div>
  </div>
  <script>
    const check = setInterval(async () => {
      try {
        const r = await fetch('http://127.0.0.1:3333/api/health');
        if (r.ok) {
          clearInterval(check);
          window.location.href = 'http://127.0.0.1:3333';
        }
      } catch {}
    }, 500);
  </script>
</body>
</html>
