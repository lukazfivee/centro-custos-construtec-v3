name: Verificacao V3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      JWT_SECRET: segredo-v3-ci-com-mais-de-trinta-e-dois-caracteres
      ADMIN_INITIAL_PASSWORD: senha-v3-ci-segura-123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoria de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Validar aplicacao
        run: npm run verify

  # Node 24 roda tambem os testes do D1 (node:sqlite), pulados no Node 20.
  # Job separado para manter o nome "test", exigido pela protecao do main.
  test-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      JWT_SECRET: segredo-v3-ci-com-mais-de-trinta-e-dois-caracteres
      ADMIN_INITIAL_PASSWORD: senha-v3-ci-segura-123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar aplicacao
        run: npm run verify

  # APK de teste do app Android (mesmas versoes do workflow de publicacao).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      # Mesma chave fixa do workflow de publicacao (ver publish-v3-1.yml).
      - name: Restaurar chave de assinatura
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_B64" ]; then echo "::warning::Sem ANDROID_DEBUG_KEYSTORE_B64: APK assinado com chave temporaria do runner."; exit 0; fi
          dir="$RUNNER_TEMP/android-user"; mkdir -p "$dir"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > "$dir/debug.keystore"
          echo "ANDROID_USER_HOME=$dir" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$dir/debug.keystore" -storepass android | grep 'SHA256:'
      - name: Gerar APK e lint
        run: |
          gradle -p android assembleDebug lintDebug --no-daemon
          mkdir -p apk && cp android/app/build/outputs/apk/debug/app-debug.apk apk/app-debug.apk
      # Mesmo app apontado para o mock do contrato no emulador (scripts/mock-central-auth.mjs na porta 8787).
      - name: Gerar APK do mock
        run: |
          gradle -p android assembleDebug --no-daemon -PcentralApiBase=http://10.0.2.2:8787 -PorcWebBase=http://10.0.2.2:8787/orc
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/app-debug-mock.apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apk/*.apk
          retention-days: 7
