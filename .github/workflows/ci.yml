name: Verificacao V3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      JWT_SECRET: segredo-v3-ci-com-mais-de-trinta-e-dois-caracteres
      ADMIN_INITIAL_PASSWORD: senha-v3-ci-segura-123
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoria de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Validar aplicacao
        run: npm run verify
