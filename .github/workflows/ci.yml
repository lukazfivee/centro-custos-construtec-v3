name: Verificacao V3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 24 roda tambem os testes do D1 (node:sqlite), pulados no Node 20.
        node: [20, 24]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      JWT_SECRET: segredo-v3-ci-com-mais-de-trinta-e-dois-caracteres
      ADMIN_INITIAL_PASSWORD: senha-v3-ci-segura-123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoria de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Validar aplicacao
        run: npm run verify
