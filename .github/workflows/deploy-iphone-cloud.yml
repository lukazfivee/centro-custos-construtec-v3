name: Publicar Worker de reports

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare-report-worker/src/**
      - cloudflare-report-worker/wrangler.toml
      - .github/workflows/deploy-iphone-cloud.yml

# O job que publicava a PWA legada (cloudflare-sync-worker) foi removido: ele
# usava o mesmo nome de Worker "centro-custos-api" e sobrescrevia o Container
# que serve a interface atual. O Centro de Custos e publicado apenas por
# "npm run deploy:cloud" (docs/CLOUD-MIGRATION-STATUS.md).

permissions:
  contents: read

jobs:
  deploy-reports:
    name: Validar e publicar suporte no Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-report-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validar segredos de implantacao
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Validar JavaScript
        run: node --check src/index.js
      - name: Publicar Worker de reports
        run: npx --yes wrangler@4.34.0 deploy --config=./wrangler.toml
