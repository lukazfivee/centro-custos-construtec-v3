name: Publicar Centro de Custos Cloud para iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare-sync-worker/public/**
      - cloudflare-sync-worker/src/**
      - cloudflare-sync-worker/wrangler.toml.example
      - public/assets/construtec-logo.png
      - public/assets/construtec-favicon.png
      - .github/workflows/deploy-iphone-cloud.yml

permissions:
  contents: read

jobs:
  deploy:
    name: Validar e publicar no Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-sync-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Copiar identidade visual oficial
        shell: bash
        run: |
          cp ../public/assets/construtec-logo.png public/construtec-logo.png
          cp ../public/assets/construtec-favicon.png public/construtec-favicon.png
          test -s public/construtec-logo.png
          test -s public/construtec-favicon.png
      - name: Validar segredos de implantacao
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "Falta CLOUDFLARE_D1_DATABASE_ID"; exit 1; }
      - name: Gerar configuracao do Wrangler
        shell: bash
        run: sed "s/__D1_DATABASE_ID__/$D1_DATABASE_ID/g" wrangler.toml.example > wrangler.toml
      - name: Validar JavaScript
        run: |
          node --check public/runtime-compat.js
          node --check public/app-v2.js
          node --check public/sw.js
          node --check src/index.js
      - name: Publicar Worker, API e PWA
        run: npx --yes wrangler@4.34.0 deploy --config=./wrangler.toml
