name: Bootstrap V3

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  importar:
    name: Importar base completa para V3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do novo repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clonar a versao final validada
        run: |
          git clone --depth 1 --branch chatgpt/p5-p8-suite-final https://github.com/lukazfivee/centro-custos-construtec.git /tmp/origem
          rm -rf /tmp/origem/.git

      - name: Copiar aplicacao preservando workflows
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/origem/ ./

      - name: Ajustar identidade V3 e dependencias
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.version = '3.0.0';
          p.description = 'Centro de Custos Construtec V3 - gestao financeira offline com sincronizacao inteligente';
          p.devDependencies = p.devDependencies || {};
          p.devDependencies.electron = '^41.7.1';
          p.devDependencies['electron-builder'] = '^26.15.3';
          p.build = p.build || {};
          p.build.publish = { provider:'github', owner:'lukazfivee', repo:'centro-custos-construtec-v3' };
          p.build.win = p.build.win || {};
          p.build.win.artifactName = 'Centro-de-Custos-Construtec-${version}-${arch}.${ext}';
          p.build.nsis = p.build.nsis || {};
          p.build.nsis.artifactName = 'Centro-de-Custos-Construtec-Setup-${version}-${arch}.${ext}';
          p.build.portable = { artifactName:'Centro-de-Custos-Construtec-Portable-${version}-${arch}.${ext}' };
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE

      - name: Regenerar lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Auditoria de dependencias de producao
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm audit --omit=dev --audit-level=high

      - name: Registrar auditoria completa
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Validar codigo
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          JWT_SECRET: segredo-v3-ci-com-mais-de-trinta-e-dois-caracteres
          ADMIN_INITIAL_PASSWORD: senha-v3-ci-segura-123
        run: |
          npm ci
          npm run verify

      - name: Registrar importacao no novo repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: importa Centro de Custos Construtec V3 completo'
          git push origin main
