name: Publicar V3.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Gerar Windows e Android
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Definir versao do pre-lancamento
        run: npm version 3.1.0-rc.17 --no-git-tag-version
      - name: Validar aplicacao
        run: npm run verify
      - name: Gerar instalador Windows
        run: npm run build
      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Gerar APK Android
        run: |
          gradle -p android assembleDebug --no-daemon
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk dist/Centro-de-Custos-Construtec-Android-3.1.0-rc.17.apk
      - name: Publicar pre-lancamento no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0-rc.17
          name: Centro de Custos Construtec V3.1.0 RC17
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Pre-lancamento RC17 da V3.1 para validacao interna.

            Melhorias desta versao:
            - seletor Suite no topo dos dois apps: Orcamentos, Centro de Custos e ChamadoPro (no navegador);
            - Ir direto para: da obra para a proposta de origem e da proposta para a obra gerada, sem sair do app;
            - comparativo de revisoes do Orcamentos adaptado ao celular;
            - Suite Construtec no Android: login central com PIN e digital, e o Centro de Custos no celular (site /m/);
            - Orcamentos dentro do app, ja logado pela mesma conta (seletor Suite), sem perder a tela aberta ao trocar de app;
            - barra inferior de vidro no site do celular;
            - o APK desta versao e assinado pela CI: quem instalou um APK gerado em outro computador precisa desinstalar antes.
          files: |
            dist/*.exe
            dist/*.apk
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: false
