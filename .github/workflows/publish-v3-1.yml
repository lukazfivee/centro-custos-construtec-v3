name: Publicar V3.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Gerar Windows e Android
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Unico lugar que muda a cada pre-lancamento: o numero da RC. O versionCode do
      # Android sai dele (3.1.0-rc.N -> 31000+N; ver versionCodeFor no Worker) e o app
      # instalado so oferece a atualizacao quando o codigo da release for maior.
      RC_NUMBER: '20'
      APP_NOTES: 'Atualização do aplicativo direto de dentro do app: Menu > Atualização do aplicativo.'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Definir versao do pre-lancamento
        run: |
          $version = "3.1.0-rc.$env:RC_NUMBER"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION_CODE=$(31000 + [int]$env:RC_NUMBER)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          npm version $version --no-git-tag-version
      - name: Validar aplicacao
        run: npm run verify
      - name: Gerar instalador Windows
        run: npm run build
      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      # Chave de assinatura fixa: a de debug do PC do Lucas, a mesma do app ja
      # instalado no celular. Sem ela, cada execucao gera outra chave e uma RC
      # nao instala por cima da outra. Sem o segredo, segue com a chave do runner.
      - name: Restaurar chave de assinatura
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if (-not $env:ANDROID_DEBUG_KEYSTORE_B64) { Write-Output "::warning::Sem ANDROID_DEBUG_KEYSTORE_B64: APK assinado com chave temporaria do runner."; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'android-user'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'debug.keystore'), [Convert]::FromBase64String($env:ANDROID_DEBUG_KEYSTORE_B64))
          "ANDROID_USER_HOME=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          keytool -list -v -keystore (Join-Path $dir 'debug.keystore') -storepass android | Select-String 'SHA256:'
      - name: Gerar APK Android
        run: |
          gradle -p android assembleDebug --no-daemon "-PappVersionName=$env:APP_VERSION" "-PappVersionCode=$env:APP_VERSION_CODE"
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk "dist/Centro-de-Custos-Construtec-Android-$env:APP_VERSION.apk"
      # O app e o Worker usam estes dois arquivos para atualizar por dentro do app:
      # hash SHA-256 do APK e um resumo da versao (latest-android.json, sem BOM).
      - name: Gerar hash e resumo do APK
        run: |
          $apk = "dist/Centro-de-Custos-Construtec-Android-$env:APP_VERSION.apk"
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLower()
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::WriteAllText("$apk.sha256", "$hash  $(Split-Path $apk -Leaf)`n", $utf8)
          $meta = [ordered]@{ versionName = $env:APP_VERSION; versionCode = [int]$env:APP_VERSION_CODE; sha256 = $hash; apk = (Split-Path $apk -Leaf); notes = $env:APP_NOTES; minVersionCode = 0 }
          [IO.File]::WriteAllText("dist/latest-android.json", ($meta | ConvertTo-Json), $utf8)
          Get-Content dist/latest-android.json
      - name: Publicar pre-lancamento no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Centro de Custos Construtec V3.1.0 RC${{ env.RC_NUMBER }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Pre-lancamento RC${{ env.RC_NUMBER }} da V3.1 para validacao interna.

            Melhorias desta versao:
            - atualizacao do aplicativo por dentro do app (Menu > Atualizacao do aplicativo): o app avisa quando ha versao nova, baixa, confere o hash e abre o instalador do Android. Esta e a ultima vez que o APK precisa ser instalado a mao;
            - cadastro pelo app: nome, e-mail, celular, codigo da empresa e senha forte; o pedido chega para os administradores aprovarem (no celular em Menu > Pedidos de acesso e no Centro web em Usuarios);
            - convite por e-mail: o link abre o cadastro no app com o codigo preenchido e a conta ja sai aprovada;
            - tour de boas-vindas em quatro telas para quem acabou de criar a conta, que pode ser revisto pelo Menu;
            - nova tela de carregamento, mais sobria: simbolo, nome do app e barra de progresso real;
            - notificacoes no celular: proposta aprovada, item acima do orcado, contas a vencer e novo acesso a conta, com central no sino do site do celular e preferencias por pessoa;
            - seletor Suite no topo dos dois apps: Orcamentos, Centro de Custos e ChamadoPro (no navegador);
            - Ir direto para: da obra para a proposta de origem e da proposta para a obra gerada, sem sair do app;
            - comparativo de revisoes do Orcamentos adaptado ao celular;
            - Suite Construtec no Android: login central com PIN e digital, e o Centro de Custos no celular (site /m/);
            - Orcamentos dentro do app, ja logado pela mesma conta (seletor Suite), sem perder a tela aberta ao trocar de app;
            - barra inferior de vidro no site do celular;
            - o APK desta versao e assinado pela CI: quem instalou um APK gerado em outro computador precisa desinstalar antes.
          files: |
            dist/*.exe
            dist/*.apk
            dist/*.apk.sha256
            dist/latest-android.json
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: false
