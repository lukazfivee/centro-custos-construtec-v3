name: Publicar V3.1.0 RC1

on:
  push:
    branches:
      - chatgpt/v3-1-multiusuario-cloudflare
    paths:
      - .github/workflows/publish-v3-1-rc1.yml

permissions:
  contents: write

jobs:
  publicar:
    name: Gerar e publicar Windows x64
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Definir versao do pre-lancamento
        run: npm version 3.1.0-rc.1 --no-git-tag-version

      - name: Validar aplicacao
        run: npm run verify

      - name: Gerar instalador e portable
        run: npm run build

      - name: Publicar pre-lancamento no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0-rc.1
          name: Centro de Custos Construtec V3.1.0 RC1
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Pre-lancamento da V3.1 para validacao antes da liberacao definitiva.

            Principais novidades:
            - sincronizacao multiusuario via Cloudflare Workers + D1;
            - login corporativo centralizado para contas @rcconstrutec.com.br;
            - usuarios reutilizaveis em diferentes computadores;
            - sincronizacao automatica de centros de custo, categorias, fornecedores e lancamentos;
            - funcionamento local/offline preservado;
            - arquivo de primeiro acesso na Area de Trabalho.

            Use o arquivo Setup x64 para instalacao normal. O Portable e destinado a testes.
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: false
