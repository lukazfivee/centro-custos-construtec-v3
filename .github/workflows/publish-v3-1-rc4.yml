name: Publicar V3.1.0 RC4

on:
  push:
    branches:
      - chatgpt/v3-1-multiusuario-cloudflare
    paths:
      - .github/workflows/publish-v3-1-rc4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Gerar e publicar Windows x64
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Definir versao do pre-lancamento
        run: npm version 3.1.0-rc.4 --no-git-tag-version

      - name: Validar aplicacao
        run: npm run verify

      - name: Gerar instalador e portable
        run: npm run build

      - name: Publicar pre-lancamento no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0-rc.4
          name: Centro de Custos Construtec V3.1.0 RC4
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Pre-lancamento RC4 da V3.1 para validacao interna.

            Inclui:
            - NF em PDF vinculada diretamente ao Centro de Custo;
            - NF vinculada carregada automaticamente na tela de Cobrancas;
            - baixar, substituir e remover NF no Centro de Custo;
            - copias corporativas automaticas nos e-mails de cobranca;
            - exclusao automatica do proprio usuario da copia;
            - Clientes, Cobrancas e envio de NF por e-mail;
            - refinamentos visuais, sidebar por hover e responsividade;
            - modo claro/escuro global;
            - login corporativo e sincronizacao Cloudflare/D1.

            Use o Setup x64 para instalacao normal.
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: false
